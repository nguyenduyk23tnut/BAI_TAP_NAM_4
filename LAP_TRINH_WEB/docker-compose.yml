
services:
# 1. Nginx Web Server
  nginx:
    image: nginx:latest
    container_name: web_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/html:/usr/share/nginx/html
      - ./nginx/conf.d:/etc/nginx/conf.d
    restart: always

  # 2. Node-RED
  nodered:
    image: nodered/node-red:latest
    container_name: web_nodered
    ports:
      - "1880:1880"
    volumes:
      - ./nodered_data:/data
    restart: always

  # 3. MariaDB Database
  mariadb:
    image: mariadb:latest
    container_name: web_mariadb
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: web_db
      MYSQL_USER: web_user
      MYSQL_PASSWORD: userpassword123
    volumes:
      - ./mariadb_data:/var/lib/mysql
    restart: always

  # 4. phpMyAdmin
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: web_phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mariadb
      MYSQL_ROOT_PASSWORD: rootpassword123
    restart: always

# 5. Cloudflare Tunnel
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: web_cloudflared
    command: tunnel --no-autoupdate run --token eyJhIjoiMDNlODUzMWQ1NzAzOWJmNTgxNDUzZGJmYWU4YzkwMWIiLCJ0IjoiNTkyZmE5MjctZjI1OC00YTk3LTgwMDktYWIwNjc1MmVjZmNmIiwicyI6Ik9EUm1OV1prWmpJdFkySmlaaTAwWVRFekxXSTFOamt0WTJWaU1XWXlOakpqWldZeCJ9
